services:
  # Nginx（Webサーバー）
  nginx:
    image: nginx:latest
    ports:
           - "${APP_PORT}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # PHP-FPM（アプリケーション）
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./src:/var/www/html
      # vendor（ライブラリ約8,000ファイル）だけは Docker の中に置いて高速化する
      # （Windows のフォルダを経由すると読み込みがとても遅いため）
      - vendor-data:/var/www/html/vendor
    depends_on:
      - db
    networks:
      - app-network

  # MySQL（データベース）
  db:
    image: mysql:8.0
    ports:
           - "${DB_HOST_PORT}:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  # phpMyAdmin（データベース管理ツール）
  phpmyadmin:
    image: phpmyadmin:latest
    ports:
     - "${PMA_PORT}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      - db
    networks:
      - app-network

  # Mailpit（開発用のメール受信ツール）
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # 受け取ったメールを確認する画面
    networks:
      - app-network
    # メールを受け取るポート（1025番）は app コンテナから使うだけなので ports に書かない

volumes:
  db-data:
  vendor-data:

networks:
  app-network:
    driver: bridge
