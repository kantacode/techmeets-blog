name: CI/CD Pipeline

# いつ動かすか：どのブランチに push しても動く ＋ main への PR でも動く
# （デプロイだけは、main に push されたときに限る。deploy ジョブの if を参照）
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  # ステップ1：コードの書き方とバグの芽をチェックする
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: PHP 8.2 を用意する
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Composer でライブラリを入れる
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer（書き方がルールどおりか）
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan（バグになりそうな箇所がないか）
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # ステップ2：テスト（lint が成功したときだけ動く）
  test:
    runs-on: ubuntu-latest          # GitHub が用意してくれる Ubuntu のサーバーで動かす
    needs: lint
    defaults:
      run:
        working-directory: src      # Laravel は src/ の中にあるので、そこでコマンドを実行する

    steps:
      - name: チェックアウト（リポジトリのコードを取ってくる）
        uses: actions/checkout@v4

      - name: PHP 8.2 を用意する（開発用の Dockerfile と同じバージョン）
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite, gd   # gd：WebP 変換のテストに使う（Week 17）
          coverage: pcov

      - name: Composer でライブラリを入れる
        run: composer install --prefer-dist --no-progress

      - name: .env を作る
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: テストを実行する（カバレッジ付き。70% 未満なら失敗にする）
        # shell: bash を書くと pipefail が有効になり、パイプ（| tee）の途中でテストが失敗しても、このステップが失敗になる
        # （書かないと tee の成功だけで判定され、テストが落ちてもデプロイまで進んでしまう）
        shell: bash
        run: php artisan test --coverage --min=70 | tee coverage.txt

      - name: カバレッジを Actions の画面に表示する
        if: always()
        run: |
          echo '## テストとカバレッジの結果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ステップ3：イメージを作って Docker Hub に置く（test が成功して、しかも main への push のときだけ）
  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Docker Hub にログインする
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # タグは2つ付ける：コミット SHA（例 abc1234。ロールバック用）と latest（いつもの最新）
      - name: app イメージのタグを決める
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/techmeets-app
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: app イメージ（PHP-FPM）を作って push する
        uses: docker/build-push-action@v5
        with:
          context: .        # リポジトリ直下（Dockerfile の COPY で src/ を指定している）
          target: app
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}

      - name: web イメージのタグを決める（app と同じルール）
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/techmeets-web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: web イメージ（Nginx ＋ public/）を作って push する
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}

  # ステップ4：本番（EC2）にデプロイする。EC2 は Docker Hub から新しいイメージを取ってきて起動するだけ
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: EC2 に SSH で入ってデプロイする
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e   # 途中のコマンドが1つでも失敗したら、そこで止めてデプロイを失敗にする
            cd ~/techmeets-blog

            # docker-compose.prod.yml と docker/nginx/prod.conf を最新にする（.env.production や certs/ は Git の外なのでそのまま）
            git fetch origin
            git checkout -B main origin/main

            # Docker Hub から latest のイメージを取ってきて、入れ替える
            # （composer install と npm run build は、イメージを作るときに済んでいる）
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # DB の更新と、設定・ルート・画面の読み込み直し
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            # 入れ替えで使わなくなった古いイメージを消して、ディスクの空きを保つ
            docker image prune -f
