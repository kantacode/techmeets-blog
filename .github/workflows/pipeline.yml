name: CI/CD Pipeline

# いつ動かすか：どのブランチに push しても動く ＋ main への PR でも動く
# （デプロイだけは、main に push されたときに限る。deploy ジョブの if を参照）
on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  # ステップ1：コードの書き方とバグの芽をチェックする
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: PHP 8.2 を用意する
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Composer でライブラリを入れる
        run: composer install --prefer-dist --no-progress

      - name: PHP CS Fixer（書き方がルールどおりか）
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan（バグになりそうな箇所がないか）
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # ステップ2：テスト（lint が成功したときだけ動く）
  test:
    runs-on: ubuntu-latest          # GitHub が用意してくれる Ubuntu のサーバーで動かす
    needs: lint
    defaults:
      run:
        working-directory: src      # Laravel は src/ の中にあるので、そこでコマンドを実行する

    steps:
      - name: チェックアウト（リポジトリのコードを取ってくる）
        uses: actions/checkout@v4

      - name: PHP 8.2 を用意する（開発用の Dockerfile と同じバージョン）
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, pdo, pdo_sqlite
          coverage: pcov

      - name: Composer でライブラリを入れる
        run: composer install --prefer-dist --no-progress

      - name: .env を作る
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: テストを実行する（カバレッジ付き。70% 未満なら失敗にする）
        run: php artisan test --coverage --min=70 | tee coverage.txt

      - name: カバレッジを Actions の画面に表示する
        if: always()
        run: |
          echo '## テストとカバレッジの結果' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ステップ3：本番（EC2）にデプロイする（test が成功して、しかも main への push のときだけ）
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: EC2 に SSH で入ってデプロイする
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e   # 途中のコマンドが1つでも失敗したら、そこで止めてデプロイを失敗にする
            cd ~/techmeets-blog

            # GitHub の main と同じ状態にする（src/.env や RDS の証明書など、Git の外のファイルはそのまま）
            git fetch origin
            git checkout -B main origin/main

            # 本番用の構成で起動し直す（Dockerfile が変わっていればイメージも作り直す）
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # ライブラリ（本番用）と DB を更新する
            docker compose -f docker-compose.prod.yml exec -T app composer install --no-dev --optimize-autoloader
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            # CSS・JS を作る（public/build は Git に入っていないため）。ディスクが少ないので軽い slim 版を使う
            docker run --rm -v "$(pwd)/src:/app" -w /app node:22-slim sh -c "npm ci && npm run build"

            # 設定・ルート・画面をまとめて読み込み直す
            docker compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan route:cache
            docker compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            # 使わなくなった古いイメージを消して、ディスクの空きを保つ
            docker image prune -f
